<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - HeartGuard AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(-45deg, #ff416c, #ff4b2b, #6a11cb, #2575fc);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    transition: 0.4s;
}

/* Gradient Animation */
@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Dark Mode */
.dark-mode {
    background: #0f172a !important;
}

/* Particle Canvas */
#particles {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 0;
}

/* Glass Card */
.register-card {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 40px;
    width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    animation: slideIn 1s ease forwards;
    transform: translateX(-100px);
    opacity: 0;
}

@keyframes slideIn {
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

/* Hologram Glow */
.register-card::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 22px;
    background: linear-gradient(45deg, #ff416c, #6a11cb, #00f2fe);
    z-index: -1;
    filter: blur(15px);
    opacity: 0.7;
}

/* Heart Animation */
.heart {
    font-size: 45px;
    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
    0% { transform: scale(1); }
    30% { transform: scale(1.2); }
    50% { transform: scale(1); }
    70% { transform: scale(1.25); }
    100% { transform: scale(1); }
}

/* Inputs */
.form-control {
    border-radius: 12px;
    margin-bottom: 15px;
    border: none;
    padding: 12px;
    transition: 0.3s;
}

.form-control:focus {
    box-shadow: 0 0 15px rgba(255,65,108,0.8);
    transform: scale(1.02);
}

/* Button */
.register-btn {
    width: 100%;
    padding: 12px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(to right, #ff416c, #ff4b2b);
    color: white;
    font-weight: 600;
    transition: 0.3s;
}

.register-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255,65,108,0.8);
}

/* Toggle Button */
.theme-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 3;
    background: white;
    border: none;
    border-radius: 30px;
    padding: 5px 15px;
    cursor: pointer;
}
</style>
</head>

<body>

<button class="theme-toggle" onclick="toggleTheme()">🌙</button>

<canvas id="particles"></canvas>

<div class="d-flex justify-content-center align-items-center h-100">

<div class="register-card text-center text-white">
    <div class="heart">❤️</div>
    <h3 class="mb-4">Create Account</h3>

    <form method="POST" onsubmit="return validatePassword()">

        <input name="username" class="form-control" placeholder="Username" required>

        <input id="password" name="password" type="password"
        class="form-control"
        placeholder="Password"
        required
        minlength="8"
        maxlength="12"
        pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,12}"
        title="Password must be 8-12 characters and include uppercase, lowercase and a number">

        <input id="confirm_password" type="password"
        class="form-control"
        placeholder="Confirm Password"
        required>

        <button type="submit" class="register-btn">Register</button>

    </form>

    <p class="mt-3">
        Already have an account?
        <a href="/login" class="text-white">Login</a>
    </p>
</div>

</div>

<script>
/* Dark Mode */
function toggleTheme(){
    document.body.classList.toggle("dark-mode");
}

/* Simple Particle Background */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<60;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*3+1,
        dx: Math.random()*1-0.5,
        dy: Math.random()*1-0.5
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="rgba(255,255,255,0.6)";
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
        p.x+=p.dx;
        p.y+=p.dy;
        if(p.x<0||p.x>canvas.width) p.dx*=-1;
        if(p.y<0||p.y>canvas.height) p.dy*=-1;
    });
    requestAnimationFrame(animate);
}
animate();
</script>
<script>
const card = document.querySelector(".register-card, .login-card");

document.addEventListener("mousemove", (e) => {
    const x = (window.innerWidth / 2 - e.pageX) / 25;
    const y = (window.innerHeight / 2 - e.pageY) / 25;
    card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
});

document.addEventListener("mouseleave", () => {
    card.style.transform = "rotateY(0deg) rotateX(0deg)";
});
</script>
<script>

function validatePassword(){

let password = document.getElementById("password").value;
let confirmPassword = document.getElementById("confirm_password").value;

if(password !== confirmPassword){
    alert("Passwords do not match!");
    return false;
}

return true;

}

</script>
</body>
</html>
