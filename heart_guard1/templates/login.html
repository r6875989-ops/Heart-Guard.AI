<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - HeartGuard AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(-45deg, #ff416c, #ff4b2b, #6a11cb, #2575fc);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
}

/* Gradient animation */

@keyframes gradientMove {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

/* Particle canvas */

#particles {
position:absolute;
width:100%;
height:100%;
z-index:0;
}

/* Login card */

.login-card{
position:relative;
z-index:2;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(20px);
border-radius:20px;
padding:40px;
width:350px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
animation:slideIn 1s ease forwards;
transform:translateX(-100px);
opacity:0;
}

@keyframes slideIn{
to{
transform:translateX(0);
opacity:1;
}
}

/* Heart animation */

.heart{
font-size:40px;
animation:heartbeat 1s infinite;
}

@keyframes heartbeat{
0%{transform:scale(1);}
30%{transform:scale(1.2);}
50%{transform:scale(1);}
70%{transform:scale(1.25);}
100%{transform:scale(1);}
}

/* Inputs */

.form-control{
border-radius:12px;
margin-bottom:15px;
border:none;
padding:12px;
transition:0.3s;
}

.form-control:focus{
box-shadow:0 0 15px rgba(255,65,108,0.8);
transform:scale(1.02);
}

/* Button */

.login-btn{
width:100%;
padding:12px;
border-radius:30px;
border:none;
background:linear-gradient(to right,#ff416c,#ff4b2b);
color:white;
font-weight:600;
transition:0.3s;
}

.login-btn:hover{
transform:scale(1.05);
box-shadow:0 0 20px rgba(255,65,108,0.8);
}

.register-link{
color:white;
text-decoration:none;
}

.register-link:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="d-flex justify-content-center align-items-center h-100">

<div class="login-card text-center text-white">

<div class="heart">❤️</div>
<h3 class="mb-4">HeartGuard AI</h3>

{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="alert alert-danger">
{{ messages[0] }}
</div>
{% endif %}
{% endwith %}

<form method="POST">

<input name="username"
class="form-control"
placeholder="Username"
autocomplete="username"
required>

<div class="position-relative">

<input id="password"
name="password"
type="password"
class="form-control"
placeholder="Password"
autocomplete="current-password"
required>

<span onclick="togglePassword()"
style="position:absolute;right:15px;top:12px;cursor:pointer;">
👁️
</span>

</div>

<button type="submit" class="login-btn">Login</button>

</form>

<p class="mt-3">
Don't have an account?
<a href="/register" class="register-link">Register</a>
</p>

</div>

</div>


<script>

/* Password toggle */

function togglePassword(){

let password=document.getElementById("password");

if(password.type==="password"){
password.type="text";
}else{
password.type="password";
}

}

/* Particle background */

const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

for(let i=0;i<60;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*3+1,
dx:Math.random()*1-0.5,
dy:Math.random()*1-0.5
});
}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="rgba(255,255,255,0.6)";

particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();

p.x+=p.dx;
p.y+=p.dy;

if(p.x<0||p.x>canvas.width)p.dx*=-1;
if(p.y<0||p.y>canvas.height)p.dy*=-1;

});

requestAnimationFrame(animate);
}

animate();

/* 3D mouse tilt effect */

const card=document.querySelector(".login-card");

document.addEventListener("mousemove",(e)=>{

const x=(window.innerWidth/2-e.pageX)/25;
const y=(window.innerHeight/2-e.pageY)/25;

card.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`;

});

document.addEventListener("mouseleave",()=>{
card.style.transform="rotateY(0deg) rotateX(0deg)";
});

</script>

</body>
</html>
