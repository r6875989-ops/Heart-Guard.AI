<!DOCTYPE html>
<html>
<head>
<title>User Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff416c, #6a11cb);
    min-height: 100vh;
}

/* Glass Container */
.profile-container {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    animation: fadeSlide 0.8s ease;
}

/* Smooth Entry */
@keyframes fadeSlide {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h2 {
    color: white;
    font-weight: 600;
    margin-bottom: 25px;
}

h4 {
    color: #fff;
    margin-top: 20px;
}

/* Inputs */
.form-control {
    border-radius: 12px;
    border: none;
    padding: 10px 14px;
    transition: 0.3s ease;
}

.form-control:focus {
    box-shadow: 0 0 12px rgba(255,255,255,0.7);
    transform: scale(1.02);
}

/* Button */
.btn-primary {
    background: linear-gradient(to right, #ff416c, #ff4b2b);
    border: none;
    border-radius: 25px;
    padding: 10px 30px;
    transition: 0.3s ease;
}

.btn-primary:hover {
    transform: scale(1.08);
    box-shadow: 0 0 18px rgba(255,65,108,0.8);
}
</style>
</head>

<body>

<div class="container mt-5">
<div class="profile-container">

<h2>🏥 Medical Profile Dashboard</h2>

<form method="POST">

<h4>👤 Personal Info</h4>

<input name="full_name" 
       class="form-control mb-2" 
       placeholder="Full Name (As per Aadhaar)" 
       value="{{ profile.full_name if profile else '' }}" required>

<input name="age" 
       type="number"
       min="1" max="120"
       class="form-control mb-2" 
       placeholder="Age (e.g. 25)" 
       value="{{ profile.age if profile else '' }}" required>

<select name="gender" class="form-control mb-2" required>
    <option value="">Select Gender</option>
    <option value="Male" {% if profile and profile.gender=='Male' %}selected{% endif %}>Male</option>
    <option value="Female" {% if profile and profile.gender=='Female' %}selected{% endif %}>Female</option>
    <option value="Other" {% if profile and profile.gender=='Other' %}selected{% endif %}>Other</option>
</select>

<input name="phone" 
       class="form-control mb-2" 
       placeholder="+91XXXXXXXXXX"
       pattern="^\+91[0-9]{10}$"
       title="Enter mobile number in format +91XXXXXXXXXX"
       value="{{ profile.phone if profile else '' }}" required>

<input name="email" 
       type="email"
       class="form-control mb-2" 
       placeholder="example@email.com"
       value="{{ profile.email if profile else '' }}" required>

<h4>🩺 Medical Info</h4>

<select name="blood_group" class="form-control mb-2" required>
    <option value="">Select Blood Group</option>
    {% for bg in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}
    <option value="{{ bg }}" {% if profile and profile.blood_group==bg %}selected{% endif %}>{{ bg }}</option>
    {% endfor %}
</select>

<select name="chronic_disease" class="form-control mb-2">
    <option value="">Select Chronic Disease</option>
    {% for disease in ['None','Diabetes','Hypertension','Heart Disease','Asthma','Thyroid','Kidney Disease'] %}
    <option value="{{ disease }}" {% if profile and profile.chronic_disease==disease %}selected{% endif %}>{{ disease }}</option>
    {% endfor %}
</select>

<select name="allergies" class="form-control mb-2">
    <option value="">Select Allergy</option>
    {% for allergy in ['None','Dust','Pollen','Food Allergy','Medicine Allergy','Skin Allergy'] %}
    <option value="{{ allergy }}" {% if profile and profile.allergies==allergy %}selected{% endif %}>{{ allergy }}</option>
    {% endfor %}
</select>

<select name="medications" class="form-control mb-2">
    <option value="">Ongoing Medication</option>
    {% for med in ['None','Insulin','BP Medication','Thyroid Medication','Heart Medication','Asthma Inhaler'] %}
    <option value="{{ med }}" {% if profile and profile.medications==med %}selected{% endif %}>{{ med }}</option>
    {% endfor %}
</select>

<h4>🆔 Government Info (Masked)</h4>

<input name="aadhaar" 
       class="form-control mb-2"
       placeholder="XXXX-XXXX-1234"
       pattern="XXXX-XXXX-[0-9]{4}"
       title="Enter masked Aadhaar format XXXX-XXXX-1234"
       value="{{ profile.aadhaar_masked if profile else '' }}">

<input name="pan" 
       class="form-control mb-2"
       placeholder="ABCDE1234F"
       pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}"
       title="Enter valid PAN format ABCDE1234F"
       value="{{ profile.pan_masked if profile else '' }}">

<input name="ayushman" 
       class="form-control mb-2"
       placeholder="Ayushman Card ID"
       value="{{ profile.ayushman_masked if profile else '' }}">

<button type="submit" class="btn btn-primary mt-3">
    💾 Save Profile
</button>

</form>

</div>
</div>

</body>
</html>
